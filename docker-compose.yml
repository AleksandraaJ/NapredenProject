version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: habit-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: habit_tracker
      MYSQL_USER: habit_user
      MYSQL_PASSWORD: habit_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend + Frontend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habit-tracker-app
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: habit_tracker
      DB_USER: habit_user
      DB_PASSWORD: habit_secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
